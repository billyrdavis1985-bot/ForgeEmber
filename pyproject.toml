[project]
name = "forgeember"
version = "0.0.1"
description = "Screens every email, invoice, attachment and voicemail a small business receives with Muse Ember, under a hard budget. Ember proposes; code decides."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Billy Davis" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27,<1",
    "pydantic>=2.7,<3",
    "pypdf>=5,<7",
]

[project.scripts]
forgeember = "forgeember.cli:main"

[dependency-groups]
dev = [
    "pillow>=11,<13",
    "pytest>=8.2",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forgeember"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=forgeember --cov-report=term-missing:skip-covered"

[tool.coverage.run]
branch = true
source = ["forgeember"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["forgeember"]
